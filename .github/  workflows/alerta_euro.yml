name: Monitorar cotacao do euro

on:
  schedule:
    - cron: "23 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-euro:
    runs-on: ubuntu-latest

    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      EURO_ALVO: ${{ vars.EURO_ALVO }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: python -m pip install requests

      - name: Consultar euro e enviar alerta
        run: python monitor_euro.py
